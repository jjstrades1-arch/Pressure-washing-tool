[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pwleads"
version = "1.0.0"
description = "Find and manage leads for a pressure washing business using free OpenStreetMap data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pressure washing", "leads", "sales", "openstreetmap", "cli"]
authors = [{ name = "pwleads" }]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# The CLI core is zero-dependency (standard library only). The optional web
# app pulls in Flask via the [web] extra: pip install .[web]
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0"]

[project.scripts]
pwleads = "pwleads.cli:main"

[tool.setuptools]
packages = ["pwleads", "pwleads.web"]

[tool.setuptools.package-data]
"pwleads.web" = ["templates/*.html", "static/*.css"]
